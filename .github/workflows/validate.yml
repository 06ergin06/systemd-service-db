name: Validate data

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JSON, schema and sort checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data files
        run: python3 scripts/validate.py --check-sorted

      - name: Check compatibility exporter
        run: |
          python3 scripts/export_legacy.py \
            --services-out "${RUNNER_TEMP}/services_data.json" \
            --profiles-out "${RUNNER_TEMP}/profiles_data.json"
          python3 -m json.tool "${RUNNER_TEMP}/services_data.json" > /dev/null
          python3 -m json.tool "${RUNNER_TEMP}/profiles_data.json" > /dev/null
